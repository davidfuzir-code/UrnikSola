<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<title>Šolski sistem</title>

<style>
    body {
        font-family: Arial;
        background: #f2f2f2;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
    }

    h1 {
        text-align: center;
    }

    button {
        padding: 10px 20px;
        margin: 10px;
        cursor: pointer;
    }

    /* Razdelitev na levi in desni del */
    .glavna-vsebina {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
    }

    .levi-del {
        flex: 2;
        min-width: 300px;
    }

    .desni-del {
        flex: 1;
        min-width: 250px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-bottom: 30px;
    }

    th, td {
        border: 1px solid #333;
        padding: 12px;
        text-align: center;
    }

    th {
        background: #4CAF50;
        color: white;
    }

    .section {
        background: white;
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 6px;
    }

    .event {
        padding: 10px;
        margin-bottom: 8px;
        border-left: 5px solid #4CAF50;
        background: #f7f7f7;
    }

    .test {
        border-left-color: #d9534f;
    }

    .ustno {
        border-left-color: #0275d8;
    }

    .pouk {
        border-left-color: #5cb85c;
    }

    .dopolnilni {
        border-left-color: #f0ad4e;
    }

    .ocena-box {
        border-left-color: #9c27b0; /* Vijolična barva za ocene */
    }

    .ocena-stevilka {
        float: right;
        font-weight: bold;
        background: #9c27b0;
        color: white;
        padding: 2px 8px;
        border-radius: 4px;
    }
</style>
</head>

<body>

<div class="container">

<h1>Šolski sistem</h1>

<div style="text-align:center; margin-bottom: 20px;">
    <button onclick="prejsnji()">Prejšnji teden</button>
    <span id="tedenText"></span>
    <button onclick="naslednji()">Naslednji teden</button>
</div>

<!-- Mreža, ki razdeli stran na dva dela -->
<div class="glavna-vsebina">
    
    <!-- Levi del z urnikom in dogodki -->
    <div class="levi-del">
        <table>
            <tr>
                <th>Dan</th>
                <th>Datum</th>
                <th>Vsebina</th>
            </tr>
            <tbody id="urnik"></tbody>
        </table>

        <div class="section">
            <h2>Vsi prihajajoči dogodki</h2>
            <div id="dogodki"></div>
        </div>

        <div class="section">
            <h2>Dopolnilni pouk</h2>
            <div id="dopolnilniPouk"></div>
        </div>
    </div>

    <!-- Desni del, kjer so prikazane ocene -->
    <div class="desni-del">
        <div class="section">
            <h2>Moje ocene</h2>
            <div id="prikazOcen"></div>
        </div>
    </div>

</div>

</div>

<script>

let teden = 1;
const baseDate = new Date(2026, 4, 7);

const urniki = {
    1: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Prosto"],
        ["Sobota", "Prosto"],
        ["Nedelja", "Računalništvo, Astronomija"]
    ],
    2: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Prosto"],
        ["Sobota", "Prosto"],
        ["Nedelja", "Prosto"]
    ],
    3: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Prosto"],
        ["Sobota", "Računalništvo,Astronomija"],
        ["Nedelja", "Navadna šola"]
    ],
    4: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Računalništvo"],
        ["Sobota", "Računalništvo"],
        ["Nedelja", "Navadna šola"]
    ],
    5: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Navadna šola"],
        ["Sobota", "Astronomija"],
        ["Nedelja", "Navadna šola"]
    ],
    6: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Prosto"],
        ["Sobota", "Navadna šola"],
        ["Nedelja", "Prosto"]
    ],
    7: [
        ["Ponedeljek", "Prosto"],
        ["Torek", "Prosto"],
        ["Sreda", "Prosto"],
        ["Četrtek", "Prosto"],
        ["Petek", "Prosto"],
        ["Sobota", "Računalništvo"],
        ["Nedelja", "Astronomija"]
    ]
};

const dneviIndex = {
    "Ponedeljek": -3,
    "Torek": -2,
    "Sreda": -1,
    "Četrtek": 0,
    "Petek": 1,
    "Sobota": 2,
    "Nedelja": 3
};

const dogodki = [
    { tip: "test", predmet: "Astronomija", datum: "26.06.2026 petek" },
];

const dopolnilniPouk = [
    {
        predmet: "Navadna šola",
        datum: "7.06.2026",
    }
];

// NOVO: Podatki o ocenah, ki jih poljubno dopolnjuješ
const ocene = [
    { predmet: "Računalništvo", ocena: 4, datum: "2.06.2026" }
];

function formatDate(date) {
    return date.toLocaleDateString("sl-SI");
}

function prikaziUrnik() {
    document.getElementById("tedenText").innerText = "Teden " + teden;

    let tbody = document.getElementById("urnik");
    tbody.innerHTML = "";

    urniki[teden].forEach(v => {
        let dan = v[0];
        let offset = dneviIndex[dan] + (teden - 1) * 7;

        let datum = new Date(baseDate);
        datum.setDate(baseDate.getDate() + offset);

        tbody.innerHTML += `
            <tr>
                <td>${dan}</td>
                <td>${formatDate(datum)}</td>
                <td>${v[1]}</td>
            </tr>
        `;
    });
}

function prikaziDogodke() {
    let div = document.getElementById("dogodki");
    div.innerHTML = "";

    let sortirani = [...dogodki].sort((a, b) =>
        new Date(a.datum) - new Date(b.datum)
    );

    sortirani.forEach(d => {
        let className = "event";
        if (d.tip === "test") className += " test";
        if (d.tip === "ustno") className += " ustno";

        div.innerHTML += `
            <div class="${className}">
                <b>${d.tip.toUpperCase()}:</b> ${d.predmet}<br>
                Datum: ${d.datum}
            </div>
        `;
    });
}

function prikaziDopolnilniPouk() {
    let div = document.getElementById("dopolnilniPouk");
    div.innerHTML = "";

    dopolnilniPouk.forEach(p => {
        div.innerHTML += `
            <div class="event dopolnilni">
                <b>Predmet:</b> ${p.predmet}<br>
                <b>Datum:</b> ${p.datum}
            </div>
        `;
    });
}

// NOVO: Funkcija za izpis ocen na desni strani
function prikaziOcene() {
    let div = document.getElementById("prikazOcen");
    div.innerHTML = "";

    if (ocene.length === 0) {
        div.innerHTML = "<p>Ni še vpisanih ocen.</p>";
        return;
    }

    ocene.forEach(o => {
        div.innerHTML += `
            <div class="event ocena-box">
                <span class="ocena-stevilka">${o.ocena}</span>
                <b>${o.predmet}</b><br>
                <small>Datum: ${o.datum}</small>
            </div>
        `;
    });
}

function naslednji() {
    if (teden < Object.keys(urniki).length) {
        teden++;
        prikaziUrnik();
    }
}

function prejsnji() {
    if (teden > 1) {
        teden--;
        prikaziUrnik();
    }
}

// Zagon vseh funkcij ob naložitvi strani
prikaziUrnik();
prikaziDogodke();
prikaziDopolnilniPouk();
prikaziOcene(); // Zažene prikaz ocen

</script>

</body>
</html>
